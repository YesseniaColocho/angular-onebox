<section class="card">
  <div>
    <h1 class="title">{{ evento.title }}</h1>
    <h2 class="subtitle">{{ evento.subtitle }}</h2>
    <div class="image">
      <img src="{{ evento.image }}" />
    </div>
    <span class="date"
      >{{ formatDate(evento.startDate) }} -
      {{ formatDate(evento.endDate) }}</span
    >
    <p class="text" [innerHTML]="evento.description"></p>
  </div>
  <button><a routerLink="/shopping-cart/{{ evento.id }}">Comprar</a></button>
</section>
